# Retransmissor do Mesa Viva na Cloudflare (plano grátis)
# Publicar:  cd relay  →  npx wrangler login  →  npx wrangler deploy
name = "mesaviva-relay"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# o plano grátis só aceita Durable Objects com armazenamento SQLite
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
