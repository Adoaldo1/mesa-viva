<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patrimônio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script>const V = new URLSearchParams(location.search).get('v') || ''; document.write(`<link rel="stylesheet" href="style.css?v=${V}">`);</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="loader"><div class="wordmark">Patrimônio</div><div class="bar"><i id="barfill"></i></div><small id="loadmsg">Montando o tabuleiro</small></div>
<div id="hud" hidden>
  <aside id="side">
    <div id="side-top">
  <div id="tools">
    <span id="clock" title="Tempo de partida">00:00</span>
    <span id="turnt" title="Tempo desta jogada" hidden></span>
    <button id="t-chat" title="Conversa" aria-label="Conversa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
    <button id="t-sfx" title="Efeitos" aria-label="Efeitos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3.5L12 18V6L7.5 10z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="slash" d="M3 3l18 18"/></svg></button>
    <button id="t-log" title="Diário" aria-label="Diário"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg></button>
    <button id="t-exit" title="Sair da partida" aria-label="Sair da partida"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></svg></button>
  </div>
  <button id="t-side" title="Minimizar o painel" aria-label="Minimizar o painel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div id="plates"></div>
    <div id="bar"></div>
    <button id="flipbtn" title="Virar a mesa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15l15-7M7 13.6V19M16.5 9.2V15M20 4l1.5 3.5L18 9"/></svg><span>Virar a mesa</span><small></small></button>
    <div id="log" hidden></div>
    <div id="chat" hidden><div class="msgs"></div><form><input maxlength="300" placeholder="Escreva aqui" aria-label="Mensagem"><button class="btn pri">Enviar</button></form></div>
  </aside>
  <div id="viewctl">
    <button id="v-2d" class="txt" title="Ver em 2D">2D</button>
    <button id="t-view" title="Ver o tabuleiro inteiro" aria-label="Ver o tabuleiro inteiro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button id="v-set" title="Personalizar a mesa" aria-label="Personalizar a mesa" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.9 1.4-2-.5-1.3.4-2.5 1.8-2.5H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg></button>
  </div>
  <div id="viewset" hidden>
    <span class="s-t">Cor do miolo</span>
    <div class="s-colors"><label id="t-paint" title="Outra cor"><i></i><input type="color" id="t-color" aria-label="Cor do miolo do tabuleiro"></label></div>
    <span class="s-t">Piso</span>
    <div class="s-floors"></div>
    <span class="s-t">Ladrilhos</span>
    <div class="s-seg"><button data-join="1">Juntos</button><button data-join="0">Separados</button></div>
    <span class="s-t">Câmera dinâmica</span>
    <div class="s-seg"><button data-dyn="1">Ligada</button><button data-dyn="0">Desligada</button></div>
  </div>
  <div id="news" hidden title="Abrir ou fechar o jornal"></div>
  <div id="vote" role="status" hidden></div>
  <div id="chip" hidden></div>
  <div id="debt" role="status" hidden><span class="d-t"></span><span class="d-s"></span><div class="d-bar"><i></i></div><small class="d-c"></small></div>
  <div id="banner"></div>
  <div id="blink"></div>
  <div id="siren" aria-hidden="true"></div>
  <div id="tip" hidden></div>
</div>
<div id="stage"><div id="sum"></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>for (const f of ['../../js/pat-data.js', '../../js/pat-engine.js', 'art.js', 'audio.js', 'scene.js', 'ui.js']) document.write(`<script src="${f}?v=${V}"><\/script>`);</script>
</body>
</html>
